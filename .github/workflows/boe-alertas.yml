name: Revisar BOE alertas C1 Informática

on:
  schedule:
    # GitHub Actions usa UTC.
    # En España peninsular será aproximadamente 08:20 en invierno / 09:20 en verano.
    - cron: "20 7 * * 1-6"

  workflow_dispatch:
    inputs:
      fecha_desde:
        description: "Fecha inicial YYYY-MM-DD. Déjalo vacío para revisar los últimos días."
        required: false
        type: string
      fecha_hasta:
        description: "Fecha final YYYY-MM-DD. Déjalo vacío para hoy."
        required: false
        type: string
      dias:
        description: "Días hacia atrás si no indicas fecha_desde"
        required: false
        default: "10"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  revisar-boe:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular rango de revisión
        id: fechas
        shell: bash
        run: |
          set -e

          FECHA_HASTA="${{ github.event.inputs.fecha_hasta }}"
          FECHA_DESDE="${{ github.event.inputs.fecha_desde }}"
          DIAS="${{ github.event.inputs.dias }}"

          if [ -z "$FECHA_HASTA" ]; then
            FECHA_HASTA=$(date -u +"%Y-%m-%d")
          fi

          if [ -z "$DIAS" ]; then
            DIAS="10"
          fi

          if [ -z "$FECHA_DESDE" ]; then
            FECHA_DESDE=$(date -u -d "$DIAS days ago" +"%Y-%m-%d")
          fi

          echo "Fecha desde: $FECHA_DESDE"
          echo "Fecha hasta: $FECHA_HASTA"

          echo "fecha_desde=$FECHA_DESDE" >> "$GITHUB_OUTPUT"
          echo "fecha_hasta=$FECHA_HASTA" >> "$GITHUB_OUTPUT"

      - name: Ejecutar escáner BOE
        timeout-minutes: 20
        shell: bash
        run: |
          set -e

          python -u scripts/scan_boe.py \
            --desde "${{ steps.fechas.outputs.fecha_desde }}" \
            --hasta "${{ steps.fechas.outputs.fecha_hasta }}"

      - name: Crear resumen de alertas nuevas
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          alertas_path = Path("outputs/alertas.json")
          issue_path = Path("docs/last_issue.md")
          count_path = Path("docs/new_alert_count.txt")

          issue_path.parent.mkdir(parents=True, exist_ok=True)

          if not alertas_path.exists():
              count_path.write_text("0", encoding="utf-8")
              issue_path.write_text("No se ha generado outputs/alertas.json", encoding="utf-8")
              raise SystemExit(0)

          data = json.loads(alertas_path.read_text(encoding="utf-8"))

          prioritarias = data.get("alertasPrioritarias", [])
          secundarias = data.get("alertasSecundarias", [])

          alertas_issue = prioritarias + secundarias

          vistas = set()
          alertas_unicas = []

          for a in alertas_issue:
              aid = a.get("id") or a.get("boeId")
              if aid not in vistas:
                  vistas.add(aid)
                  alertas_unicas.append(a)

          count = len(alertas_unicas)
          count_path.write_text(str(count), encoding="utf-8")

          lines = []
          lines.append("# Nuevas alertas BOE detectadas")
          lines.append("")
          lines.append(f"Total alertas prioritarias/secundarias: **{count}**")
          lines.append("")
          lines.append("Filtro aplicado:")
          lines.append("")
          lines.append("- Informática / TIC / TAI: prioridad máxima.")
          lines.append("- Administrativo C1: prioridad secundaria.")
          lines.append("- Auxiliar administrativo C2: oculto por defecto.")
          lines.append("- Policía, bomberos, peones, letrados, FHN y ruido similar: descartado.")
          lines.append("")

          if not alertas_unicas:
              lines.append("No hay alertas prioritarias o secundarias en este rango.")
          else:
              for a in alertas_unicas:
                  titulo = a.get("titulo", "Sin título")
                  fecha = a.get("fechaPublicacion", "")
                  perfil = a.get("perfilReal", "")
                  prioridad = a.get("prioridadUsuario", "")
                  motivo = a.get("motivoRelevanciaUsuario", "")
                  enlace = a.get("enlaceBoeHtml", "")
                  pdf = a.get("enlacePdf", "")
                  plazas = a.get("plazasExtraidas", [])

                  lines.append(f"## {titulo}")
                  lines.append("")
                  lines.append(f"- **Fecha:** {fecha}")
                  lines.append(f"- **Perfil detectado:** {perfil}")
                  lines.append(f"- **Prioridad:** {prioridad}")
                  lines.append(f"- **Motivo:** {motivo}")

                  if plazas:
                      lines.append("- **Plazas/frases detectadas:**")
                      for p in plazas[:5]:
                          lines.append(f"  - {p}")

                  if enlace:
                      lines.append(f"- **BOE:** {enlace}")
                  if pdf:
                      lines.append(f"- **PDF:** {pdf}")

                  lines.append("")

          issue_path.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Guardar cambios en JSON y dashboard
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/alertas.json docs/alertas.json docs/index.html docs/styles.css docs/app.js docs/last_issue.md docs/new_alert_count.txt

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualizar alertas BOE"
            git push
          fi

      - name: Crear issue si hay alertas nuevas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          COUNT=$(cat docs/new_alert_count.txt 2>/dev/null || echo 0)
          echo "Nuevas alertas prioritarias/secundarias: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            gh issue create \
              --title "Nuevas alertas BOE detectadas ($COUNT)" \
              --body-file docs/last_issue.md \
              --label "boe" \
              --label "alerta" || \
            gh issue create \
              --title "Nuevas alertas BOE detectadas ($COUNT)" \
              --body-file docs/last_issue.md
          else
            echo "No se crea issue porque no hay alertas nuevas prioritarias/secundarias."
          fi
